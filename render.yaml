services:
  # ---------------------------------------------------------------------------
  # 1. Backend: FastAPI Clinical Decision Support Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: medha-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10

  # ---------------------------------------------------------------------------
  # 2. Frontend: React + Vite Single Page Application
  # ---------------------------------------------------------------------------
  - type: web
    name: medha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medha-backend
          property: host

